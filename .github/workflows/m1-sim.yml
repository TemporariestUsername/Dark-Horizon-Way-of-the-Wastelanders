name: Sim

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate data
        run: python3 tools/validate_data.py

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/dark-horizon
          key: godot-4.4.1-stable-linux

      - name: Get Godot (pinned, checksum-verified)
        run: |
          godot="$(tools/get_godot.sh)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"

      - name: Unit tests
        run: timeout 300 "$GODOT" --headless --path . --script res://tests/run_tests.gd

      - name: Battle bench (300 fights per encounter)
        run: timeout 300 "$GODOT" --headless --path . --script res://tools/battle_bench.gd -- --fights 300

      - name: Event bench (100 journeys per route)
        run: timeout 300 "$GODOT" --headless --path . --script res://tools/event_bench.gd -- --journeys 100

      - name: Balance report (50 seeds x 120 months)
        run: timeout 900 "$GODOT" --headless --path . --script res://tools/sim_runner.gd -- --months 120 --seeds 50

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-reports
          path: tools/out/
